<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playground</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup">
      <header class="popup__header">
        <div class="popup__logo" aria-hidden="true">🎪</div>
        <div>
          <h1 class="popup__title">Playground</h1>
          <p class="popup__tagline">Make the internet playful</p>
        </div>
      </header>

      <section class="popup__card popup__card--toggle">
        <div class="toggle-row">
          <span class="toggle-label">Playground</span>
          <label class="toggle">
            <input type="checkbox" id="toggle-enabled" checked />
            <span class="toggle__track">
              <span class="toggle__thumb"></span>
            </span>
            <span class="toggle__state" id="toggle-state">ON</span>
          </label>
        </div>
      </section>

      <section class="popup__card popup__card--toggle popup__card--swipe" id="swipe-card" hidden>
        <div class="toggle-row">
          <div>
            <span class="toggle-label">Swipe Feed</span>
            <span class="toggle-sublabel">Tinder for LinkedIn posts</span>
          </div>
          <label class="toggle">
            <input type="checkbox" id="toggle-swipe" />
            <span class="toggle__track">
              <span class="toggle__thumb"></span>
            </span>
            <span class="toggle__state" id="swipe-state">OFF</span>
          </label>
        </div>
      </section>

      <section class="popup__card popup__card--status" id="status-card">
        <div class="status-row">
          <span class="status-label">Website</span>
          <span class="status-value" id="site-status">Checking…</span>
        </div>
        <div class="status-row">
          <span class="status-label">Theme</span>
          <span class="status-value status-value--theme" id="theme-status">—</span>
        </div>
        <div class="status-row">
          <span class="status-label">Animals</span>
          <span class="status-value" id="animal-count">0</span>
        </div>
      </section>

      <section class="popup__actions">
        <button type="button" class="btn btn--primary" id="btn-spawn">
          <span aria-hidden="true">✨</span>
          Spawn More Animals
        </button>
        <button type="button" class="btn btn--secondary" id="btn-clear">
          <span aria-hidden="true">🧹</span>
          Clear Animals
        </button>
      </section>

      <footer class="popup__footer">
        <p>Visit LinkedIn, GitHub, or YouTube to see the magic.</p>
      </footer>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
